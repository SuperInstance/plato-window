[package]
name = "plato-window"
version = "0.1.0"
edition = "2021"
description = "Sliding window operations for PLATO tile streams and JEPA context"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lib]
name = "plato_window"
path = "src/lib.rs"
